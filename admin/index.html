<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Site admin — Gyða</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;700&family=Vollkorn&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css?v=22a1f95e">
</head>
<body>

<section id="signin" class="signin" hidden>
  <div class="signin-card">
    <p class="kicker">gydadiamond.net</p>
    <h1>Site admin</h1>
    <form id="signin-form">
      <input type="text" name="username" value="Gyða" autocomplete="username" hidden>
      <label>Password<input id="pass" type="password" autocomplete="current-password" required></label>
      <button class="btn solid" type="submit">Sign in</button>
      <p class="err" id="signin-err" role="alert"></p>
    </form>
    <p><button class="link" id="forgot" type="button">Forgot the password, or first time here?</button></p>
    <p class="local-only" hidden><button class="link" id="try-local" type="button">Try it without signing in (local test, nothing is saved)</button></p>
  </div>
</section>

<section id="newpass" class="signin" hidden>
  <div class="signin-card">
    <p class="kicker">gydadiamond.net</p>
    <h1>New password</h1>
    <p>Choose at least 12 characters. Three or four words that don’t belong together are easy to remember and hard to guess.</p>
    <form id="newpass-form">
      <input type="text" name="username" value="Gyða" autocomplete="username" hidden>
      <label>New password<input id="new1" type="password" autocomplete="new-password" minlength="12" required></label>
      <label>The same again<input id="new2" type="password" autocomplete="new-password" required></label>
      <label>Code from Gunnar<input id="code" type="text" inputmode="numeric" autocomplete="off" placeholder="6 digits" maxlength="7" required></label>
      <p class="hint">Ask Gunnar for a code when you are ready to press Save. It only works for about a minute.</p>
      <button class="btn solid" type="submit">Save</button> <button class="btn" type="button" id="newpass-cancel">Cancel</button>
      <p class="err" id="newpass-err" role="alert"></p>
    </form>
  </div>
</section>

<div id="app" hidden>
  <header class="top">
    <a class="brand" href="../" target="_blank" title="Open the website">◆ GYDA <span>admin</span></a>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="front">Front page</button>
      <button role="tab" data-tab="about">About</button>
      <button role="tab" data-tab="work">Work</button>
      <button role="tab" data-tab="videos">Videos</button>
      <button role="tab" data-tab="news">News</button>
      <button role="tab" data-tab="live">Live</button>
      <button role="tab" data-tab="films">Films</button>
      <button role="tab" data-tab="photos">Photos</button>
      <button role="tab" data-tab="settings">Contact &amp; press</button>
    </nav>
    <a class="link guide-link" id="guide-link" href="guide/" target="_blank">Guide</a>
    <button class="link" id="change-pass">Password</button>
    <button class="link" id="signout">Sign out</button>
  </header>
  <main id="panel" class="panel"></main>
  <footer class="dock">
    <span id="status" class="status">Loading…</span>
    <span class="dock-btns">
      <button class="btn" id="discard" disabled>Undo all</button>
      <button class="btn" id="preview" disabled>Preview</button>
      <button class="btn solid" id="publish" disabled>Publish</button>
    </span>
  </footer>
</div>

<div id="toast" class="toast" role="status" hidden></div>
<script src="service.js?v=2677012a"></script>
<script src="admin.js?v=1375e14e"></script>
</body>
</html>
