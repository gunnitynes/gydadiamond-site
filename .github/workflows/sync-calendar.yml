# Reads Gyða's public shows calendar every morning (and when "Sync now" is pressed in the admin)
# and saves the shows to data/calendar.json for the LIVE page.
name: Sync calendar
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: calendar
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/sync_calendar.py
      - name: Save if changed
        run: |
          if ! git diff --quiet -- data/calendar.json; then
            git config user.name "calendar sync"
            git config user.email "actions@users.noreply.github.com"
            git add data/calendar.json
            git commit -m "Calendar sync: update shows"
            git push
          fi
